name: Windows self-host smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**"

jobs:
  smoketest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Start PHP built-in server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath php -ArgumentList "-S 127.0.0.1:8000 -t ." -PassThru
          Start-Sleep -Seconds 2
          "PHP_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test
        shell: pwsh
        run: |
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 30
          if ($resp.StatusCode -lt 200 -or $resp.StatusCode -ge 400) { throw "HTTP $($resp.StatusCode)" }

      - name: Stop server
        if: always()
        shell: pwsh
        run: |
          if ($env:PHP_PID) {
            Stop-Process -Id $env:PHP_PID -Force
          }
