<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="Layered mountain landscape with pine trees and birds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6d8"/>
      <stop offset="0.5" stop-color="#d9dfcf"/>
      <stop offset="1" stop-color="#f5efe2"/>
    </linearGradient>
    <linearGradient id="sunwash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5efe2" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e8ddbd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c7b078" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8b8a0"/>
      <stop offset="1" stop-color="#d8d5c7"/>
    </linearGradient>
    <linearGradient id="midMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e957e"/>
      <stop offset="1" stop-color="#b3b5a1"/>
    </linearGradient>
    <linearGradient id="nearMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f705a"/>
      <stop offset="1" stop-color="#87927a"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42553f"/>
      <stop offset="1" stop-color="#243a2d"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf5e9" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#faf5e9" stop-opacity="0.72"/>
      <stop offset="0.75" stop-color="#faf5e9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#faf5e9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#sunwash)"/>
  <circle cx="1240" cy="155" r="112" fill="#ead29b" opacity="0.34" filter="url(#soft)"/>

  <path d="M390 496 538 380 654 432 770 294 913 435 1068 226 1205 366 1338 196 1600 359V720H390Z" fill="url(#farMountain)" opacity="0.82"/>
  <path d="m655 431 116-136 46 72 41-39 55 106 52-53 103-155 70 115 67-56 133-89 262 163v361H560Z" fill="none" stroke="#e9e4d7" stroke-width="12" stroke-linejoin="round" opacity="0.7"/>
  <path d="M660 548 805 430 934 488 1078 354 1195 437 1340 306 1600 415V720H660Z" fill="url(#midMountain)" opacity="0.86"/>
  <path d="M810 610 963 492 1104 543 1230 431 1367 492 1494 386 1600 433V720H810Z" fill="url(#nearMountain)"/>

  <path d="M410 610c290-86 600-42 1190 14v96H410Z" fill="url(#mist)" filter="url(#soft)" opacity="0.78"/>
  <path d="M590 656c290-82 640-45 1010 4v60H590Z" fill="#f7f1e5" opacity="0.64"/>

  <g fill="url(#forest)" opacity="0.96">
    <path d="m1118 430-24 55h14l-27 58h18l-34 67h106l-34-67h18l-27-58h14Z"/>
    <path d="m1195 405-20 47h12l-23 50h15l-29 58h90l-29-58h15l-23-50h12Z"/>
    <path d="m1284 449-22 50h13l-25 54h16l-31 62h98l-31-62h16l-25-54h13Z"/>
    <path d="m1378 401-25 58h15l-29 61h19l-36 72h112l-36-72h19l-29-61h15Z"/>
    <path d="m1485 435-25 58h15l-29 61h19l-36 72h112l-36-72h19l-29-61h15Z"/>
    <path d="m1564 389-23 54h14l-27 57h18l-34 68h104l-34-68h18l-27-57h14Z"/>
  </g>

  <g fill="none" stroke="#5f6958" stroke-width="3" stroke-linecap="round" opacity="0.72">
    <path d="M1026 167q15-13 30 0 15-13 30 0"/>
    <path d="M1108 126q11-10 22 0 11-10 22 0"/>
    <path d="M1178 185q9-8 18 0 9-8 18 0"/>
    <path d="M1284 118q13-11 26 0 13-11 26 0"/>
  </g>

  <rect width="1600" height="720" fill="transparent" filter="url(#grain)" opacity="0.55"/>
</svg>
